<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Traffic Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <nav class="navbar">
      <h1 class="title">Network Traffic Monitor</h1>
      <button id="modeButton" class="mode-static">Switch to Live Capture</button>
    </nav>

    <section class="controls-bar">
      <div class="capture-controls">
        <button id="startBtn" type="button">Start</button>
        <button id="stopBtn" type="button">Stop</button>
      </div>

      <div class="filters-bar">
        <select id="protocolFilter">
          <option value="">All Protocols</option>
        </select>
        <input id="sourceIpFilter" type="text" placeholder="Source IP">
        <input id="destinationIpFilter" type="text" placeholder="Destination IP">
        <button id="applyFilterBtn" type="button">Filter</button>
        <button id="resetFilterBtn" type="button">Reset / Clear Filter</button>
      </div>
    </section>

    <section class="table-section">
      <table>
        <thead>
          <tr>
            <th>Time</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Protocol</th>
          </tr>
        </thead>
        <tbody id="packetTableBody"></tbody>
      </table>
    </section>

    <section class="bottom-row">
      <div class="detail-panel">
        <h2>Packet Details</h2>
        <textarea id="packetDetail" readonly></textarea>
      </div>

      <aside class="stats-panel">
        <div class="stat-card">
          <h3>Total Packets</h3>
          <p id="totalPackets">0</p>
        </div>
        <div class="stat-card">
          <h3>Average Packet Size</h3>
          <p id="averagePacketSize">0.00</p>
        </div>
        <div class="stat-card full-width">
          <h3>Packets Per Protocol</h3>
          <div id="protocolStats"></div>
        </div>
      </aside>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
